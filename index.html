<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Быстрый калькулятор деления</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        :root {
            --bg: #eef2f5;
            --card: #ffffff;
            --text: #1e2a3a;
            --text-light: #5a6e7c;
            --border: #dce5ec;
            --input-bg: #ffffff;
            --primary: #2c7da0;
            --primary-dark: #1f5e7a;
            --success: #2e8b57;
            --danger: #e07a5f;
            --danger-bg: #fde9e5;
            --history-hover: #f0f4f8;
        }
        body.dark {
            --bg: #121826;
            --card: #1e293b;
            --text: #f1f5f9;
            --text-light: #94a3b8;
            --border: #334155;
            --input-bg: #0f172a;
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --success: #34d399;
            --danger: #f87171;
            --danger-bg: #451a1a;
            --history-hover: #334155;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            margin: 0;
            min-height: 100vh;
            padding: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.2s;
        }
        .app {
            max-width: 1100px;
            width: 100%;
            background: var(--card);
            border-radius: 40px;
            padding: 24px 24px 32px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.08);
            transition: background 0.2s;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin: 0;
            color: var(--text);
            letter-spacing: -0.3px;
        }
        .theme-btn {
            background: var(--border);
            border: none;
            font-size: 1.5rem;
            width: 48px;
            height: 48px;
            border-radius: 30px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
        }
        .theme-btn:active { transform: scale(0.96); }
        
        .input-group {
            margin-bottom: 24px;
        }
        .input-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text);
            font-size: 0.95rem;
        }
        .big-input {
            width: 100%;
            padding: 18px 20px;
            font-size: 1.3rem;
            font-weight: 500;
            border: 2px solid var(--border);
            border-radius: 28px;
            background: var(--input-bg);
            color: var(--text);
            font-family: monospace;
            transition: 0.1s;
        }
        .big-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(44,125,160,0.2);
        }
        
        .divisors-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin: 8px 0 12px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .divisors-header span {
            font-weight: 600;
            color: var(--text);
            font-size: 1rem;
        }
        .quick-actions {
            display: flex;
            gap: 12px;
        }
        .icon-btn {
            background: var(--border);
            border: none;
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            color: var(--text);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .icon-btn:active { transform: scale(0.97); }
        .icon-btn.danger { background: var(--danger-bg); color: var(--danger); }
        
        .divisors-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
            max-height: 360px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .divisor-row {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--input-bg);
            border-radius: 28px;
            padding: 6px 12px 6px 18px;
            border: 1px solid var(--border);
        }
        .divisor-row .div-num {
            font-weight: 600;
            color: var(--text-light);
            min-width: 70px;
            font-size: 0.9rem;
        }
        .divisor-row input {
            flex: 1;
            padding: 14px 12px;
            font-size: 1.1rem;
            border: none;
            background: transparent;
            color: var(--text);
            font-family: monospace;
            font-weight: 500;
        }
        .divisor-row input:focus { outline: none; }
        .divisor-row .remove-div {
            background: none;
            border: none;
            font-size: 1.3rem;
            cursor: pointer;
            color: var(--danger);
            width: 44px;
            height: 44px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .divisor-row .remove-div:active { background: var(--danger-bg); }
        
        .results-area {
            margin-top: 28px;
            background: var(--bg);
            border-radius: 28px;
            overflow: hidden;
        }
        .results-title {
            font-weight: 700;
            padding: 16px 20px;
            background: var(--card);
            border-bottom: 1px solid var(--border);
            color: var(--text);
            font-size: 1rem;
        }
        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            border-bottom: 1px solid var(--border);
            background: var(--card);
        }
        .divisor-value {
            font-weight: 600;
            color: var(--text);
            font-size: 1rem;
        }
        .result-badge {
            background: var(--primary);
            color: white;
            padding: 6px 16px;
            border-radius: 40px;
            font-weight: 600;
            font-family: monospace;
        }
        .result-badge.reject {
            background: var(--danger-bg);
            color: var(--danger);
        }
        
        .history-area {
            margin-top: 28px;
            background: var(--card);
            border-radius: 28px;
            border: 1px solid var(--border);
        }
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            border-bottom: 1px solid var(--border);
            font-weight: 700;
            color: var(--text);
        }
        .history-list {
            max-height: 260px;
            overflow-y: auto;
        }
        .history-item {
            padding: 12px 20px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: 0.05s linear;
            color: var(--text);
        }
        .history-item:active { background: var(--history-hover); }
        .history-main {
            font-weight: 500;
            font-size: 0.9rem;
        }
        .history-date {
            font-size: 0.7rem;
            color: var(--text-light);
            margin-top: 4px;
        }
        .clear-history {
            background: none;
            border: none;
            color: var(--danger);
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            padding: 6px 12px;
        }
        footer {
            font-size: 0.7rem;
            text-align: center;
            margin-top: 24px;
            color: var(--text-light);
        }
        @media (max-width: 550px) {
            .app { padding: 16px; }
            .big-input { padding: 14px 16px; font-size: 1.2rem; }
            .divisor-row { padding: 4px 8px 4px 14px; }
            .divisor-row input { padding: 10px 8px; font-size: 1rem; }
            .div-num { min-width: 55px; font-size: 0.8rem; }
            .result-item { padding: 12px 16px; }
            .icon-btn { padding: 8px 14px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>
<div class="app">
    <div class="top-bar">
        <h1>⚡ Деление ≤3 знаков</h1>
        <button class="theme-btn" id="themeToggle">🌙</button>
    </div>
    
    <div class="input-group">
        <label>🔢 Делимое</label>
        <input type="number" id="dividend" class="big-input" value="100" step="any" placeholder="Число">
    </div>
    
    <div class="divisors-header">
        <span>📌 Делители (нажимайте + / –)</span>
        <div class="quick-actions">
            <button id="addDivBtn" class="icon-btn">➕ Добавить</button>
            <button id="removeLastBtn" class="icon-btn danger">➖ Удалить</button>
        </div>
    </div>
    
    <div id="divisorsList" class="divisors-list"></div>
    
    <div class="results-area" id="resultsArea">
        <div class="results-title">📊 Результаты</div>
        <div style="padding: 24px; text-align: center; color: var(--text-light);">Введите данные — расчёт мгновенный</div>
    </div>
    
    <div class="history-area">
        <div class="history-header">
            📜 История (клик для восстановления)
            <button id="clearHistoryBtn" class="clear-history">Очистить всё</button>
        </div>
        <div id="historyList" class="history-list">
            <div style="padding: 24px; text-align: center; color: var(--text-light);">Нет расчётов</div>
        </div>
    </div>
    <footer>🔹 Автоматический пересчёт при любом изменении 🔹 Показываются только числа с ≤3 знаками после запятой</footer>
</div>

<script>
    // ---------- БЫСТРЫЕ ФУНКЦИИ ----------
    function getDecimalCount(num) {
        if (isNaN(num)) return -1;
        let abs = Math.abs(num);
        let frac = abs - Math.floor(abs);
        if (frac < 1e-12) return 0;
        let str = frac.toString();
        str = str.replace(/^0\./, '');
        if (str.includes('e')) return 10;
        return str.length;
    }
    
    function formatNumber(num) {
        let s = num.toString();
        if (s.includes('.')) s = s.replace(/\.?0+$/, '');
        return s;
    }
    
    // ---------- DOM ----------
    const dividendInput = document.getElementById('dividend');
    const divisorsContainer = document.getElementById('divisorsList');
    const addBtn = document.getElementById('addDivBtn');
    const removeLastBtn = document.getElementById('removeLastBtn');
    const resultsDiv = document.getElementById('resultsArea');
    const historyListDiv = document.getElementById('historyList');
    const clearHistoryBtn = document.getElementById('clearHistoryBtn');
    
    let divisorValues = [2, 3, 4, 5, 8]; // начальные 5 делителей
    
    // ---------- Отрисовка полей делителей ----------
    function renderDivisors() {
        divisorsContainer.innerHTML = '';
        divisorValues.forEach((val, idx) => {
            const row = document.createElement('div');
            row.className = 'divisor-row';
            row.innerHTML = `
                <span class="div-num">Делитель ${idx+1}</span>
                <input type="number" class="div-input" value="${val}" step="any" placeholder="Число">
                <button class="remove-div" data-index="${idx}">✕</button>
            `;
            const input = row.querySelector('.div-input');
            input.addEventListener('input', (e) => {
                let newVal = parseFloat(e.target.value);
                if (!isNaN(newVal)) divisorValues[idx] = newVal;
                else divisorValues[idx] = 0;
                autoCalculate();
            });
            const delBtn = row.querySelector('.remove-div');
            delBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (divisorValues.length <= 1) {
                    alert('Нужен хотя бы один делитель');
                    return;
                }
                divisorValues.splice(idx, 1);
                renderDivisors();
                autoCalculate();
            });
            divisorsContainer.appendChild(row);
        });
    }
    
    function addDivisor() {
        divisorValues.push(2);
        renderDivisors();
        autoCalculate();
    }
    
    function removeLastDivisor() {
        if (divisorValues.length <= 1) {
            alert('Должен быть хотя бы один делитель');
            return;
        }
        divisorValues.pop();
        renderDivisors();
        autoCalculate();
    }
    
    // ---------- Вычисление и отображение результатов ----------
    let currentResults = null; // кеш для истории
    
    function computeResults() {
        const dividend = parseFloat(dividendInput.value);
        if (isNaN(dividend)) return { error: true, html: '<div class="results-title">📊 Результаты</div><div style="padding:20px;color:var(--danger);">⚠️ Введите число в делимое</div>' };
        
        let valid = true;
        const divs = [];
        for (let i=0; i<divisorValues.length; i++) {
            let v = divisorValues[i];
            if (isNaN(v)) { valid = false; break; }
            divs.push(v);
        }
        if (!valid) return { error: true, html: '<div class="results-title">📊 Результаты</div><div style="padding:20px;color:var(--danger);">⚠️ Проверьте делители</div>' };
        
        let resultsHtml = '<div class="results-title">📊 Результаты</div>';
        const raw = [];
        for (let i=0; i<divs.length; i++) {
            const d = divs[i];
            if (d === 0) {
                resultsHtml += `<div class="result-item"><span class="divisor-value">${d}</span><span class="result-badge reject">⚠️ деление на 0</span></div>`;
                raw.push({ divisor: d, status: 'zero' });
                continue;
            }
            const q = dividend / d;
            const dec = getDecimalCount(q);
            if (dec <= 3) {
                const formatted = formatNumber(q);
                resultsHtml += `<div class="result-item"><span class="divisor-value">${d}</span><span class="result-badge">${formatted}</span></div>`;
                raw.push({ divisor: d, status: 'ok', value: formatted, decimalCount: dec });
            } else {
                resultsHtml += `<div class="result-item"><span class="divisor-value">${d}</span><span class="result-badge reject">❌ >3 знаков (${dec})</span></div>`;
                raw.push({ divisor: d, status: 'too_many', decimalCount: dec });
            }
        }
        return { error: false, html: resultsHtml, rawResults: raw, dividend, divisors: divs };
    }
    
    function autoCalculate() {
        const res = computeResults();
        if (res.error) {
            resultsDiv.innerHTML = res.html;
            return;
        }
        resultsDiv.innerHTML = res.html;
        // сохраняем в историю (но только если изменилось, чтобы не спамить)
        saveToHistory(res.dividend, res.divisors, res.rawResults);
    }
    
    // ---------- История (localStorage) ----------
    let history = [];
    
    function loadHistory() {
        const stored = localStorage.getItem('fastDivisionHistory');
        if (stored) {
            try {
                history = JSON.parse(stored);
                if (!Array.isArray(history)) history = [];
            } catch(e) { history = []; }
        } else history = [];
        renderHistory();
    }
    
    function saveHistory() {
        localStorage.setItem('fastDivisionHistory', JSON.stringify(history.slice(0, 20)));
    }
    
    function saveToHistory(dividend, divisors, resultsArray) {
        const newItem = {
            dividend,
            divisors: [...divisors],
            results: resultsArray.map(r => ({ divisor: r.divisor, status: r.status, value: r.value || null })),
            timestamp: Date.now()
        };
        // избегаем дублирования одинаковых подряд (просто добавим в начало)
        history.unshift(newItem);
        if (history.length > 20) history = history.slice(0, 20);
        saveHistory();
        renderHistory();
    }
    
    function renderHistory() {
        if (!historyListDiv) return;
        if (history.length === 0) {
            historyListDiv.innerHTML = '<div style="padding: 24px; text-align: center; color: var(--text-light);">Нет расчётов</div>';
            return;
        }
        let html = '';
        for (let i=0; i<history.length; i++) {
            const item = history[i];
            const date = new Date(item.timestamp).toLocaleString();
            const okCount = item.results.filter(r => r.status === 'ok').length;
            html += `
                <div class="history-item" data-idx="${i}">
                    <div class="history-main">${item.dividend} ÷ [${item.divisors.join(', ')}]</div>
                    <div class="history-date">${date} • успешных: ${okCount}</div>
                </div>
            `;
        }
        historyListDiv.innerHTML = html;
        document.querySelectorAll('.history-item').forEach(el => {
            el.addEventListener('click', (e) => {
                const idx = parseInt(el.getAttribute('data-idx'));
                if (!isNaN(idx) && history[idx]) {
                    restoreFromHistory(history[idx]);
                }
            });
        });
    }
    
    function restoreFromHistory(item) {
        dividendInput.value = item.dividend;
        divisorValues = [...item.divisors];
        renderDivisors();
        autoCalculate(); // пересчитает и сохранит новую историю (но дубль не страшен)
    }
    
    function clearHistory() {
        if (confirm('Очистить всю историю?')) {
            history = [];
            saveHistory();
            renderHistory();
        }
    }
    
    // ---------- Тёмная тема ----------
    const themeBtn = document.getElementById('themeToggle');
    function setTheme(theme) {
        if (theme === 'dark') {
            document.body.classList.add('dark');
            themeBtn.innerHTML = '☀️';
            localStorage.setItem('fastTheme', 'dark');
        } else {
            document.body.classList.remove('dark');
            themeBtn.innerHTML = '🌙';
            localStorage.setItem('fastTheme', 'light');
        }
    }
    function toggleTheme() {
        if (document.body.classList.contains('dark')) setTheme('light');
        else setTheme('dark');
    }
    const savedTheme = localStorage.getItem('fastTheme');
    if (savedTheme === 'dark') setTheme('dark');
    else setTheme('light');
    themeBtn.addEventListener('click', toggleTheme);
    
    // ---------- События ----------
    dividendInput.addEventListener('input', autoCalculate);
    addBtn.addEventListener('click', addDivisor);
    removeLastBtn.addEventListener('click', removeLastDivisor);
    clearHistoryBtn.addEventListener('click', clearHistory);
    
    // Инициализация
    renderDivisors();
    loadHistory();
    autoCalculate(); // первый расчёт
</script>
</body>
</html>
